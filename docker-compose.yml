# -------------------------------------------------------------
#  docker-compose.yml
#  Project : Multi-Tool AI Agent with Human-in-the-Loop
# -------------------------------------------------------------


services:
  postgres:
    # PostgreSQL image that already includes the pgvector extension
    image: pgvector/pgvector:pg16

    # A readable name for this local database container
    container_name: multi_tool_agent_db

    environment:
      # These credentials are only for local development
      POSTGRES_DB: multi_tool_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: change_me_local_only

    ports:
      # Python app will connect to localhost:5432
      - "5433:5432"

    volumes:
      # Keeps database data even after Docker restarts
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
